{{- if .Values.route.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "app.fullname" . }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ required "host is required" .Values.route.host }}`)
      kind: Rule
      services:
        - name: {{ include "app.fullname" . }}
          port: {{ .Values.route.port }}
  tls:
    secretName: {{ include "app.fullname" . }}-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "app.fullname" . }}
spec:
  secretName: {{ include "app.fullname" . }}-tls
  dnsNames:
    - {{ required "host is required" .Values.route.host }}
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
{{- end }}
