apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: my-git-clone
spec:
  params:
    - name: url
      type: string
      description: 클론할 Git 리포지토리 URL
      default: https://example.com/repo.git
    - name: revision
      type: string
      description: 체크아웃할 브랜치/태그/커밋
      default: main
  workspaces:
    - name: source
      description: Git 리포지토리가 저장될 워크스페이스
  steps:
    - name: git-clone-or-update
      image: docker.io/alpine/git
      workingDir: /workspace/source
      script: |
        #!/bin/sh
        set -eu

        git clone "$(params.url)" .
        git checkout "$(params.revision)"
